{% extends "student/layout.html" %}
{% block title %}Profile & Settings{% endblock %}

{% block content %}
<div style="max-width: 640px;">
    <h2 style="font-size: 1.45rem; margin-bottom: 6px;">Student Profile & Career Preferences</h2>
    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Update your academic info and target career role for tailored ATS scoring.</p>

    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ user['full_name'] }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email Address (Read-only)</label>
                <input type="email" value="{{ user['email'] }}" class="form-control" disabled style="background: #f1f5f9;">
            </div>
            <div class="form-group">
                <label>College / University</label>
                <input type="text" name="college" value="{{ user['college'] }}" class="form-control">
            </div>
            <div class="form-group">
                <label>Target Career Role</label>
                <select name="target_role" class="form-control">
                    {% for r in roles %}
                      <option value="{{ r }}" {% if r == user['target_role'] %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
        </form>
    </div>
</div>
{% endblock %}
